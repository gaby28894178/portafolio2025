<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Fondo con gradiente azul celeste y blanco (colores de la bandera argentina) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000033" />
      <stop offset="100%" style="stop-color:#000066" />
    </linearGradient>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="800" height="600" fill="url(#bgGradient)" />
  
  <!-- Barra de navegación -->
  <rect width="800" height="60" fill="#000033" />
  
  <!-- Logo TV Argentina -->
  <text x="30" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF">TV Argentina Online</text>
  
  <!-- Botones de navegación -->
  <text x="300" y="40" font-family="Arial" font-size="16" fill="#FFFFFF">Canales</text>
  <text x="400" y="40" font-family="Arial" font-size="16" fill="#FFFFFF">En Vivo</text>
  <text x="500" y="40" font-family="Arial" font-size="16" fill="#FFFFFF">Programación</text>
  
  <!-- Botón de usuario -->
  <circle cx="700" cy="30" r="20" fill="#75AADB" />
  <text x="700" y="35" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">U</text>
  
  <!-- Formulario de inicio de sesión -->
  <rect x="200" y="120" width="400" height="360" rx="10" fill="#FFFFFF" opacity="0.1" stroke="#75AADB" stroke-width="2" />
  
  <!-- Título del formulario -->
  <text x="400" y="170" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Iniciar Sesión</text>
  
  <!-- Icono de usuario -->
  <circle cx="400" cy="220" r="30" fill="#75AADB" opacity="0.5" />
  <circle cx="400" cy="210" r="10" fill="#FFFFFF" />
  <path d="M380,235 Q400,255 420,235" stroke="#FFFFFF" stroke-width="2" fill="none" />
  
  <!-- Campo de email -->
  <rect x="250" y="270" width="300" height="40" rx="5" fill="#000033" stroke="#75AADB" stroke-width="1" />
  <text x="270" y="295" font-family="Arial" font-size="14" fill="#75AADB">Email</text>
  <text x="330" y="295" font-family="Arial" font-size="14" fill="#FFFFFF">demo@tvargentina.com</text>
  
  <!-- Campo de contraseña -->
  <rect x="250" y="330" width="300" height="40" rx="5" fill="#000033" stroke="#75AADB" stroke-width="1" />
  <text x="270" y="355" font-family="Arial" font-size="14" fill="#75AADB">Contraseña</text>
  <text x="370" y="355" font-family="Arial" font-size="14" fill="#FFFFFF">••••••••</text>
  
  <!-- Botón de inicio de sesión -->
  <rect x="300" y="390" width="200" height="40" rx="20" fill="#FFD700" />
  <text x="400" y="415" font-family="Arial" font-size="16" font-weight="bold" fill="#000033" text-anchor="middle">INGRESAR</text>
  
  <!-- Enlace de recuperación de contraseña -->
  <text x="400" y="450" font-family="Arial" font-size="12" fill="#75AADB" text-anchor="middle">¿Olvidaste tu contraseña?</text>
  
  <!-- Información de usuario demo -->
  <rect x="200" y="500" width="400" height="60" rx="5" fill="#000033" stroke="#FFD700" stroke-width="1" />
  <text x="400" y="525" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">👤 Usuario Demo</text>
  <text x="400" y="545" font-family="Arial" font-size="12" fill="#FFFFFF" text-anchor="middle">Email: demo@tvargentina.com | Contraseña: demo123</text>
  
  <!-- Footer -->
  <rect x="0" y="580" width="800" height="20" fill="#000033" />
  <text x="400" y="595" font-family="Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">© 2024 TV Argentina. Todos los derechos reservados.</text>
  
  <!-- Sol de Mayo (símbolo argentino) -->
  <circle cx="150" y="520" r="15" fill="#FFD700" />
  <g fill="#FFD700">
    <!-- Rayos del sol -->
    <polygon points="150,495 155,505 150,505" />
    <polygon points="170,500 165,510 160,505" />
    <polygon points="180,515 170,515 165,510" />
    <polygon points="175,535 165,525 170,520" />
    <polygon points="150,545 150,535 155,530" />
    <polygon points="130,535 135,525 140,530" />
    <polygon points="120,515 130,515 135,520" />
    <polygon points="125,500 135,510 130,515" />
  </g>
  
  <!-- Sol de Mayo (símbolo argentino) -->
  <circle cx="650" y="520" r="15" fill="#FFD700" />
  <g fill="#FFD700">
    <!-- Rayos del sol -->
    <polygon points="650,495 655,505 650,505" />
    <polygon points="670,500 665,510 660,505" />
    <polygon points="680,515 670,515 665,510" />
    <polygon points="675,535 665,525 670,520" />
    <polygon points="650,545 650,535 655,530" />
    <polygon points="630,535 635,525 640,530" />
    <polygon points="620,515 630,515 635,520" />
    <polygon points="625,500 635,510 630,515" />
  </g>
</svg>