<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Fondo con gradiente negro y azul (estilo nocturno) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000033" />
      <stop offset="100%" style="stop-color:#75AADB" />
    </linearGradient>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="800" height="600" fill="url(#bgGradient)" />
  
  <!-- Reproductor de video principal -->
  <rect x="100" y="100" width="600" height="350" rx="5" fill="#000000" />
  
  <!-- Contenido del reproductor (simulación de video) -->
  <rect x="100" y="100" width="600" height="350" rx="5" fill="#75AADB" opacity="0.2" />
  
  <!-- Logo de canal en el video -->
  <text x="130" y="130" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF" opacity="0.7">TV Pública</text>
  
  <!-- Controles del reproductor -->
  <rect x="100" y="450" width="600" height="40" rx="5" fill="#000000" opacity="0.8" />
  
  <!-- Barra de progreso -->
  <rect x="120" y="465" width="400" height="10" rx="5" fill="#333333" />
  <rect x="120" y="465" width="250" height="10" rx="5" fill="#FFD700" />
  
  <!-- Botón de play/pausa -->
  <circle cx="550" cy="470" r="15" fill="#FFD700" />
  <polygon points="545,465 545,475 555,470" fill="#000033" />
  
  <!-- Botón de pantalla completa -->
  <rect x="580" y="460" width="20" height="20" stroke="#FFFFFF" stroke-width="2" fill="none" />
  
  <!-- Tiempo de reproducción -->
  <text x="480" y="475" font-family="Arial" font-size="12" fill="#FFFFFF">25:10 / 45:30</text>
  
  <!-- Información del programa -->
  <rect x="100" y="500" width="600" height="80" rx="5" fill="#FFFFFF" opacity="0.1" />
  
  <!-- Título del programa -->
  <text x="120" y="525" font-family="Arial" font-size="18" font-weight="bold" fill="#FFFFFF">Noticiero Central</text>
  
  <!-- Descripción del programa -->
  <text x="120" y="550" font-family="Arial" font-size="14" fill="#FFFFFF" opacity="0.8">Últimas noticias de Argentina y el mundo. Actualidad, política y economía.</text>
  
  <!-- Calificación -->
  <text x="120" y="570" font-family="Arial" font-size="12" fill="#FFD700">★★★★☆ 4.2/5</text>
  
  <!-- Botones de acción -->
  <rect x="500" y="530" width="80" height="30" rx="15" fill="#FFD700" />
  <text x="540" y="550" font-family="Arial" font-size="12" font-weight="bold" fill="#000033" text-anchor="middle">Compartir</text>
  
  <rect x="600" y="530" width="80" height="30" rx="15" fill="#75AADB" />
  <text x="640" y="550" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Favoritos</text>
  
  <!-- Barra de navegación superior -->
  <rect width="800" height="60" fill="#000033" />
  
  <!-- Logo TV Argentina -->
  <text x="30" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF">TV Argentina Online</text>
  
  <!-- Botones de navegación -->
  <text x="300" y="40" font-family="Arial" font-size="16" fill="#FFFFFF">Canales</text>
  <text x="400" y="40" font-family="Arial" font-size="16" fill="#FFD700">En Vivo</text>
  <text x="500" y="40" font-family="Arial" font-size="16" fill="#FFFFFF">Programación</text>
  
  <!-- Botón de usuario -->
  <circle cx="700" cy="30" r="20" fill="#75AADB" />
  <text x="700" y="35" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">U</text>
</svg>