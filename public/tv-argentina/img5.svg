<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Fondo con gradiente azul celeste y blanco (colores de la bandera argentina) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000033" />
      <stop offset="100%" style="stop-color:#000066" />
    </linearGradient>
    
    <!-- Gradiente para tarjetas -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#75AADB" />
      <stop offset="100%" style="stop-color:#000066" />
    </linearGradient>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="800" height="600" fill="url(#bgGradient)" />
  
  <!-- Barra de navegación -->
  <rect width="800" height="60" fill="#000033" />
  
  <!-- Logo TV Argentina -->
  <text x="30" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF">TV Argentina Online</text>
  
  <!-- Botones de navegación -->
  <text x="300" y="40" font-family="Arial" font-size="16" fill="#FFFFFF">Canales</text>
  <text x="400" y="40" font-family="Arial" font-size="16" fill="#FFFFFF">En Vivo</text>
  <text x="500" y="40" font-family="Arial" font-size="16" fill="#FFD700">Programación</text>
  
  <!-- Botón de usuario -->
  <circle cx="700" cy="30" r="20" fill="#75AADB" />
  <text x="700" y="35" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">U</text>
  
  <!-- Título de sección -->
  <text x="400" y="100" font-family="Arial" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Programación del Día</text>
  
  <!-- Fecha -->
  <text x="400" y="130" font-family="Arial" font-size="16" fill="#75AADB" text-anchor="middle">Lunes, 30 de Julio de 2024</text>
  
  <!-- Selector de canales -->
  <rect x="100" y="150" width="600" height="40" rx="5" fill="#000033" />
  <text x="120" y="175" font-family="Arial" font-size="14" fill="#FFFFFF">Canal:</text>
  <rect x="180" y="155" width="200" height="30" rx="5" fill="#75AADB" opacity="0.3" />
  <text x="280" y="175" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle">Telefe</text>
  <polygon points="360,165 370,175 350,175" fill="#FFFFFF" />
  
  <!-- Tabla de programación -->
  <rect x="100" y="200" width="600" height="350" rx="5" fill="#000033" opacity="0.5" />
  
  <!-- Encabezado de tabla -->
  <rect x="100" y="200" width="600" height="40" rx="5" fill="#75AADB" opacity="0.5" />
  <text x="150" y="225" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">Hora</text>
  <text x="300" y="225" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">Programa</text>
  <text x="600" y="225" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">Duración</text>
  
  <!-- Programa 1 -->
  <rect x="100" y="240" width="600" height="40" fill="#000033" opacity="0.3" />
  <text x="150" y="265" font-family="Arial" font-size="14" fill="#FFFFFF">06:00</text>
  <text x="300" y="265" font-family="Arial" font-size="14" fill="#FFFFFF">Telefe Noticias AM</text>
  <text x="600" y="265" font-family="Arial" font-size="14" fill="#FFFFFF">120 min</text>
  
  <!-- Programa 2 -->
  <rect x="100" y="280" width="600" height="40" fill="#000033" opacity="0.5" />
  <text x="150" y="305" font-family="Arial" font-size="14" fill="#FFFFFF">08:00</text>
  <text x="300" y="305" font-family="Arial" font-size="14" fill="#FFFFFF">Buen Telefe</text>
  <text x="600" y="305" font-family="Arial" font-size="14" fill="#FFFFFF">180 min</text>
  
  <!-- Programa 3 -->
  <rect x="100" y="320" width="600" height="40" fill="#000033" opacity="0.3" />
  <text x="150" y="345" font-family="Arial" font-size="14" fill="#FFFFFF">11:00</text>
  <text x="300" y="345" font-family="Arial" font-size="14" fill="#FFFFFF">Cortá por Lozano</text>
  <text x="600" y="345" font-family="Arial" font-size="14" fill="#FFFFFF">120 min</text>
  
  <!-- Programa 4 -->
  <rect x="100" y="360" width="600" height="40" fill="#000033" opacity="0.5" />
  <text x="150" y="385" font-family="Arial" font-size="14" fill="#FFFFFF">13:00</text>
  <text x="300" y="385" font-family="Arial" font-size="14" fill="#FFFFFF">Telefe Noticias</text>
  <text x="600" y="385" font-family="Arial" font-size="14" fill="#FFFFFF">90 min</text>
  
  <!-- Programa 5 -->
  <rect x="100" y="400" width="600" height="40" fill="#000033" opacity="0.3" />
  <text x="150" y="425" font-family="Arial" font-size="14" fill="#FFFFFF">14:30</text>
  <text x="300" y="425" font-family="Arial" font-size="14" fill="#FFD700">Zuleyha</text>
  <text x="600" y="425" font-family="Arial" font-size="14" fill="#FFFFFF">90 min</text>
  
  <!-- Programa 6 -->
  <rect x="100" y="440" width="600" height="40" fill="#000033" opacity="0.5" />
  <text x="150" y="465" font-family="Arial" font-size="14" fill="#FFFFFF">16:00</text>
  <text x="300" y="465" font-family="Arial" font-size="14" fill="#FFFFFF">Fugitiva</text>
  <text x="600" y="465" font-family="Arial" font-size="14" fill="#FFFFFF">120 min</text>
  
  <!-- Programa 7 -->
  <rect x="100" y="480" width="600" height="40" fill="#000033" opacity="0.3" />
  <text x="150" y="505" font-family="Arial" font-size="14" fill="#FFFFFF">18:00</text>
  <text x="300" y="505" font-family="Arial" font-size="14" fill="#FFFFFF">Telefe Noticias</text>
  <text x="600" y="505" font-family="Arial" font-size="14" fill="#FFFFFF">90 min</text>
  
  <!-- Paginación -->
  <rect x="350" y="560" width="100" height="30" rx="15" fill="#000033" stroke="#75AADB" stroke-width="1" />
  <text x="370" y="580" font-family="Arial" font-size="14" fill="#FFFFFF">1</text>
  <text x="390" y="580" font-family="Arial" font-size="14" fill="#75AADB">2</text>
  <text x="410" y="580" font-family="Arial" font-size="14" fill="#75AADB">3</text>
  <text x="430" y="580" font-family="Arial" font-size="14" fill="#75AADB">></text>
  
  <!-- Footer -->
  <rect x="0" y="580" width="800" height="20" fill="#000033" />
  <text x="400" y="595" font-family="Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">© 2024 TV Argentina. Todos los derechos reservados.</text>
</svg>